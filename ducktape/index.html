<html lang="en">

<style>

<body>
<canvas id="c"></canvas>
<button id="fs" aria-label="Full screen" hidden><svg viewBox="0 0 12 12" fill="rgba(255,255,255,.7)"><path d="M0 0h4v1H1v3H0zM8 0h4v4h-1V1H8zM0 8h1v3h3v1H0zM11 8h1v4H8v-1h3z"/></svg></button>
<script>
(function () {
  "use strict";

  var TAGS = {
    idle: { from: 0, d: [400, 300, 400, 300] }, sleepy: { from: 4, d: [300, 200, 200, 300] }, walk: { from: 8, d: [100, 100] }, jump: { from: 10, d: [100] },

    } catch (e) { return img; }   // if the art can't be read (cross-origin), fall back to the plain duck
  }

  var cv = document.getElementById("c"), ctx = cv.getContext("2d"), W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.imageSmoothingEnabled = false;
  }
  addEventListener("resize", resize); resize();
  function drawSprite(idx, x, y, s, flip, rot, hue) {   // x,y = center of the frame

    var img = (hue && SHEETS[hue]) || SHEET;

  }

  /* ---------- sound ---------- */
  var audio = null, quackBuf = null;

        .then(function (b) { return new Promise(function (ok, no) { audio.decodeAudioData(b, ok, no); }); })
        .then(function (buf) { quackBuf = buf; }).catch(function () {});
    }
    if (audio.state !== "running") audio.resume();

  }
  function quack(rate, vol) {

  function blip(f1, f2, dur) {
    var c = actx(); if (!c) return;

    o.type = "triangle"; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);

    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur);
  }

  // same soft sound effects as the duck on the main site
  function puff(dur, f0, f1, vol) {
    var c = actx(); if (!c) return;
    try {
      var t = c.currentTime, len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) { var k = i / len; d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * Math.min(1, k * 1.15)) * (1 - k); }
      var src = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
      src.buffer = buf; fl.type = "lowpass"; fl.Q.value = 0.7; fl.frequency.setValueAtTime(f0, t);
      if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);

    } catch (e) {}
  }
  function tone(type, f0, f1, dur, vol, delay) {
    var c = actx(); if (!c) return;
    try {
      var t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  }
  function jit(v, a) { return v * (1 + (Math.random() * 2 - 1) * a); }
  function whoosh() { puff(0.34, 300, 1500, 0.16); }
  function thud() { tone("sine", jit(120, 0.08), 48, 0.18, 0.22); puff(0.07, 500, 200, 0.07); }
  function boing() { var f = jit(300, 0.1); tone("sine", f, f * 1.9, 0.18, 0.08); tone("sine", f * 1.9, f * 1.5, 0.13, 0.045, 0.1); }
  function flap() { puff(0.06, 650, 350, 0.08); }
  function bloop() { tone("sine", jit(420, 0.06), 760, 0.1, 0.07); }
  function chime() { [660, 880, 1320].forEach(function (f, i) { tone("sine", f, f, 0.24, 0.05, i * 0.08); }); }

  /* ---------- background particles ---------- */
  var COLORS = ["#56bebc", "#f6c945", "#ff8fa3", "#9be37a", "#8fb8ff", "#ffffff"];
  var bg = [];
  for (var i = 0; i < 30; i++) bg.push({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 3.5, v: 0.004 + Math.random() * 0.01, ph: Math.random() * 6.3, c: COLORS[i % COLORS.length], a: 0.08 + Math.random() * 0.2 });
  var fx = [];   // bursts: confetti squares, hearts, "QUACK!" text
  function burst(x, y, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 6;
      fx.push({ k: "p", x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3, s: 4 + Math.random() * 6, c: COLORS[(Math.random() * COLORS.length) | 0], life: 1, rot: Math.random() * 6 });
    }
  }
  var WORDS = ["QUACK!", "quack!", "Quack!", "QUAAACK!", "quack quack!"];
  function word(x, y, t) { fx.push({ k: "t", x: x, y: y, vx: (Math.random() - 0.5) * 1.5, vy: -2.2, t: t || WORDS[(Math.random() * WORDS.length) | 0], c: COLORS[(Math.random() * 5) | 0], life: 1 }); }

  /* ---------- ducks (start with 1, max 5 incl. eggs) ---------- */
  var PEEK = new Image(); PEEK.crossOrigin = "anonymous"; PEEK.src = ART + "peek.png";
  SHEET.onload = PEEK.onload = buildTints;
  var MAX = 5, ducks = [], eggs = [];
  function bigScale() { return innerWidth <= 767 ? 2.5 : 3; }   // same size as the duck on the main site
  function floorY() { return H * 0.62; }
  /* five characters: what a tap does and how often they fly on their own */
  var KINDS = ["flyer", "singer", "naughty", "sleepy", "jumpy"];
  var FLY = { flyer: 0.75, singer: 0.15, naughty: 0.2, sleepy: 0.1, jumpy: 0.3 };
  var usedHues = [];
  function pickKind() { var have = ducks.map(function (o) { return o.kind; }), free = KINDS.filter(function (k) { return have.indexOf(k) < 0; }); free = free.length ? free : KINDS; return free[(Math.random() * free.length) | 0]; }
  function pickHue() { var have = ducks.map(function (o) { return o.hue; }); if (!ducks.length) return 0; for (var i = 1; i < HUES.length; i++) if (have.indexOf(i) < 0) return i; return 1 + ((Math.random() * (HUES.length - 1)) | 0); }
  function newDuck(x) { return { kind: pickKind(), hue: pickHue(), x: x, tx: x, tag: "idle", until: 0, tagStart: 0, sq: 1, jy: 0, jv: 0, flip: false, taps: [], mode: "here", idleAt: performance.now(), egg: false }; }
  ducks.push(newDuck(0.5));
  function layout() {   // spread ducks and eggs evenly across the floor
    var all = ducks.concat(eggs), n = all.length;
    var r0 = keyRect(0), span = (r0.w + 6) * NK, left = r0.x - 3;
    all.forEach(function (o, i) { o.tx = (left + span * (i + 0.5) / Math.max(n, 1)) / W; });
  }
  function takeOff(d, now) {   // fly somewhere in the sky, hover a bit, then glide back down
    if (d.mode !== "here" || d.air) return;
    d.air = { tx: 0.12 + Math.random() * 0.76, ty: -(H * (0.15 + Math.random() * 0.3)), until: now + 2500 + Math.random() * 3000 };
    d.jv = 0; d.flapAt = 0; quack(1.6, 0.3); whoosh();
  }
  function setTag(d, tag, ms, now) { d.tag = tag; d.until = ms ? now + ms : 0; d.tagStart = now; }
  function box(d) { var s = bigScale(); return { x: d.x * W, y: floorY() + d.jy, s: s, r: FR * s * 0.42 }; }
  function peekBox(d) { var s = bigScale() * 0.8; return { x: d.x * W, y: H - 16 * s * 0.5, w: 16 * s, h: 20 * s, s: s }; }
  function hide(d, now) { d.mode = "hiding"; d.flip = Math.random() < 0.5; quack(1.8, 0.3); whoosh(); }
  var NOTES = [0, 2, 4, 5, 7, 9, 11, 12].map(function (n) { return Math.pow(2, n / 12); });   // do re mi fa sol la si do, equal temperament
  var NK = 8, KEYCOL = ["#ff6b6b", "#ff9f43", "#f6c945", "#9be37a", "#56bebc", "#8fb8ff", "#b48cff", "#ff8fc8"], keyLit = [0, 0, 0, 0, 0, 0, 0, 0];
  function keyRect(k) { var s = bigScale(), kw = Math.min(W * 0.94, 600) / NK, x0 = W / 2 - kw * NK / 2, y = floorY() + FR * s * 0.5 + 6;
    return { x: x0 + k * kw + 3, y: y, w: kw - 6, h: Math.max(90, 34 * s) }; }
  function pianoTone(k) {   // soft plucked piano note (C D E G A) under the quack
    var c = actx(); if (!c) return;
    var f = [523.25, 587.33, 659.25, 783.99, 880][k], t = c.currentTime;
    [1, 2, 3].forEach(function (h, i) {
      var o = c.createOscillator(), g = c.createGain(); o.type = "sine"; o.frequency.value = f * h;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime([0.09, 0.03, 0.012][i], t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1 / h);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 1.2);
    });
  }
  function keyAt(px_) { var r0 = keyRect(0), kw = r0.w + 6; return Math.max(0, Math.min(NK - 1, Math.floor((px_ - (r0.x - 3)) / kw))); }
  function noteOf(d) { return NOTES[keyAt(d.x * W)]; }
  function playKey(k, now) {
    keyLit[k] = 1; quack(NOTES[k] * 0.9, 0.4);
    ducks.forEach(function (d) { if (d.mode === "here" && !d.air && keyAt(d.x * W) === k && d.jy === 0) { d.jv = -6; d.sq = 0.7; setTag(d, "jump", 0, now); } });
  }
  function drawKeys() {   // 8 white keys (do re mi fa sol la si do) with black keys between, like a tiny piano
    var s = bigScale(), r0 = keyRect(0), kw = r0.w + 6;
    ctx.fillStyle = "#2a2a2a"; ctx.fillRect(r0.x - 3 - s * 2, r0.y - s * 3, kw * NK + s * 4, r0.h + s * 5);   // case
    ctx.fillStyle = "#c0392b"; ctx.fillRect(r0.x - 3 - s * 2, r0.y - s * 3, kw * NK + s * 4, s);              // felt strip
    for (var k = 0; k < NK; k++) {
      var r = keyRect(k), lit = keyLit[k]; keyLit[k] *= 0.88; var press = lit > 0.3 ? s : 0;
      ctx.fillStyle = lit > 0.3 ? "#d8d2c4" : "#f4efe4"; ctx.fillRect(r.x, r.y + press, r.w, r.h - s - press);
      ctx.fillStyle = "#bdb6a6"; ctx.fillRect(r.x, r.y + r.h - s * 2, r.w, s);                                 // key lip
      ctx.globalAlpha = 0.5 + lit * 0.5; ctx.fillStyle = KEYCOL[k];                                             // colour dot so little ones can tell them apart
      ctx.fillRect(r.x + r.w / 2 - s * 1.5, r.y + r.h - s * 6 + press, s * 3, s * 3); ctx.globalAlpha = 1;
    }
    [0, 1, 3, 4, 5].forEach(function (k) {   // black keys like a real octave: none between mi-fa and si-do
      var r = keyRect(k), bw = r.w * 0.5, bx = r.x + r.w + 3 - bw / 2;
      ctx.fillStyle = "#151515"; ctx.fillRect(bx, r.y, bw, r.h * 0.58);
      ctx.fillStyle = "#3a3a3a"; ctx.fillRect(bx + s, r.y + r.h * 0.58 - s * 2, bw - s * 2, s);
    });
  }
  /* little tunes: a list of [key, beats]; each note is a quack on that piano key */
  var seqTimers = [];
  function playSeq(notes, beat, onNote, done) {
    var t = 0;
    notes.forEach(function (n, i) { seqTimers.push(setTimeout(function () { if (n[0] >= 0) playKey(n[0], performance.now()); if (onNote) onNote(i); }, t)); t += n[1] * beat; });
    if (done) seqTimers.push(setTimeout(done, t));
  }
  var TUNES = [[[0, .5], [2, .5], [4, 1]], [[4, .5], [4, .5], [5, .5], [4, 1]], [[7, .5], [6, .5], [4, .5], [2, 1]], [[0, .5], [4, .5], [7, 1]], [[4, .5], [2, .5], [3, .5], [1, .5], [0, 1]]];
  function sing(d) {   // the singer: a short tune, bobbing along
    if (d.singing) return; d.singing = true; var b = box(d); word(b.x, b.y - b.r * 1.3, "\u266B");
    playSeq(TUNES[(Math.random() * TUNES.length) | 0], 300, function () { if (d.jy === 0 && !d.air) { d.jv = -4; } }, function () { d.singing = false; });
  }
  function prank(d, now) {   // the naughty one: sneaks up on another duck and bumps it, or stomps the piano
    var others = ducks.filter(function (o) { return o !== d && o.mode === "here" && !o.air; });
    if (others.length && Math.random() < 0.7) d.prank = { who: others[(Math.random() * others.length) | 0] };
    else d.prank = { key: (Math.random() * NK) | 0 };
    d.prank.until = now + 5000;
  }
  function stepPrank(d, now) {
    var P = d.prank, tx = P.who ? P.who.x * W + (P.who.x * W > d.x * W ? -FR * bigScale() * 0.6 : FR * bigScale() * 0.6) : keyRect(P.key).x + keyRect(P.key).w / 2;
    if (now > P.until || (P.who && (P.who.mode !== "here" || ducks.indexOf(P.who) < 0))) { d.prank = null; d.tx = d.x; return; }

    if (Math.abs(dx) > 4) { d.x += Math.sign(dx) * Math.min(Math.abs(dx), 2.2) / W; d.flip = dx < 0; d.walking = true; return; }

  }
  function moodAct(d, now) {   // what each character does on its own now and then
    if (d.kind === "singer" && Math.random() < 0.6) { sing(d); return true; }
    if (d.kind === "naughty" && ducks.length > 1 && Math.random() < 0.6) { prank(d, now); return true; }
    if (d.kind === "sleepy") { setTag(d, "sleepy", 3500, now); var b = box(d); word(b.x + b.r, b.y - b.r, "z z"); return true; }
    if (d.kind === "jumpy" && d.jy === 0) { d.jv = -9; boing(); setTag(d, "jump", 0, now); return true; }
    return false;
  }

  /* the "Five Little Ducks" button under the piano: the whole song sung in quacks (do=0 ... high do=7) */
  var SONG = [
    [4, .5], [2, .5], [2, .5], [2, 1], [3, .5], [2, .5], [1, 1], [1, 1.5], [-1, .5],         // Five little ducks went out one day
    [2, .5], [0, .5], [0, .5], [0, 1], [1, .5], [2, .5], [1, 1], [1, 1.5], [-1, .5],         // Over the hills and far away
    [4, .5], [4, .5], [2, .5], [2, .5], [4, .5], [4, .5], [4, .5], [4, 1.5], [-1, .5],       // Mother duck said quack quack quack quack
    [2, .5], [2, .5], [1, .5], [1, .5], [2, .5], [1, .5], [0, .5], [1, .5], [0, 2]           // But only four little ducks came back
  ];
  var songOn = false;
  function songRect() { var r0 = keyRect(0), w = 132, h = 48; return { x: W / 2 - w / 2, y: r0.y + r0.h + 22, w: w, h: h }; }
  function stopSong() { seqTimers.forEach(clearTimeout); seqTimers = []; songOn = false; ducks.forEach(function (d) { d.singing = false; }); }
  function toggleSong() {
    if (songOn) { stopSong(); return; }
    stopSong(); songOn = true;
    playSeq(SONG, 420, function () { ducks.forEach(function (d) { if (d.mode === "here" && !d.air && d.jy === 0 && Math.random() < 0.5) d.jv = -3; }); }, function () { songOn = false; });
  }
  function drawSongButton(now) {
    var r = songRect(), s = bigScale();
    ctx.fillStyle = songOn ? "#2d8987" : "#1f1f1f"; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(r.x, r.y, r.w, 2);
    ctx.fillStyle = "#f4efe4"; var cx = r.x + 22, cy = r.y + r.h / 2;
    if (songOn) { ctx.fillRect(cx - 7, cy - 8, 5, 16); ctx.fillRect(cx + 2, cy - 8, 5, 16); }                       // pause
    else for (var i = 0; i < 8; i++) ctx.fillRect(cx - 6 + i * 2, cy - 8 + i, 2, 16 - i * 2);                      // play
    for (var k = 0; k < 5; k++) drawSprite(0, r.x + 48 + k * 17, cy + (songOn ? Math.sin(now / 150 + k) * 2 : 0), 0.9, false, 0, k ? k : 0);   // five little ducks
  }

  function pokeDuck(d, x, y, now) {
    d.idleAt = now; d.taps = d.taps.filter(function (t) { return now - t < 1800; }); d.taps.push(now);
    var b = box(d); d.sq = 0.7;
    if (d.air) setTag(d, "fly", 0, now);
    else if (d.kind === "flyer") { setTag(d, "idle", 0, now); takeOff(d, now); }
    else if (d.kind === "singer") { sing(d); return; }                              // sings a little tune
    else if (d.kind === "naughty") { prank(d, now); }                               // goes off to bother someone
    else if (d.kind === "sleepy") setTag(d, "sleepy", 1400, now);                   // yawns
    else if (d.jy === 0) { d.jv = -11; boing(); setTag(d, "jump", 0, now); }        // jumpy: big hop
    keyLit[keyAt(d.x * W)] = 1; quack(noteOf(d) * 0.9, 0.4); burst(b.x, b.y - b.r, 3); word(b.x, b.y - b.r * 1.2, "\u266A");
  }
  function tapPeek(d, now) {   // tumble in from the sky; lays an egg on landing if there is room
    d.mode = "falling"; d.jy = -floorY() - FR * bigScale(); d.jv = 0; d.egg = ducks.length + eggs.length < MAX;
    quack(1.3, 0.5); whoosh();
  }
  function tapEgg(e, now) {
    e.hits++; e.shake = 1; blip(300 + e.hits * 120, 200, 0.1); var b = eggBox(e); burst(b.x, b.y, 3);
    if (e.hits >= e.need) {
      eggs.splice(eggs.indexOf(e), 1); var d = newDuck(e.x); d.tx = e.tx; d.sq = 0.5; d.jv = -12; setTag(d, "jump", 0, now); ducks.push(d); layout();
      burst(b.x, b.y, 13); word(b.x, b.y - 40, "peep!"); quack(1.9, 0.5); chime();
    }
  }
  /* pixel-art egg, 10x12: o = outline, w = shell, s = shade, y = spot, c = crack */
  var EGG = ["...oooo...", "..owwwwo..", ".owwwwyyo.", ".owwwwyyo.", "owwwwwwwso", "owyywwwwso", "owyywwwwso", "owwwwwwwso", "owwwwwwsso", ".owwwwsso.", "..osssso..", "...oooo..."];
  var CRACK = [[2, 4], [3, 5], [4, 4], [5, 5], [6, 4], [7, 5], [3, 6], [6, 6]];
  var EGGC = { o: "#2a2420", w: "#fff8e6", s: "#e3d7bb", y: "#9ad0c8" };
  function eggBox(e) { var s = bigScale(); return { x: e.x * W, y: floorY() + FR * s * 0.42 - 6 * s, s: s, ry: 6 * s }; }
  function drawEgg(e, now) {
    var b = eggBox(e), s = b.s; e.shake *= 0.85; var rot = Math.sin(now / 30) * 0.3 * e.shake;
    ctx.save(); ctx.translate(b.x, b.y + 6 * s); ctx.rotate(rot); ctx.translate(-5 * s, -12 * s);
    for (var r = 0; r < 12; r++) for (var c = 0; c < 10; c++) { var k = EGG[r][c]; if (k !== ".") { ctx.fillStyle = EGGC[k]; ctx.fillRect(c * s, r * s, s + 0.5, s + 0.5); } }
    ctx.fillStyle = EGGC.o;
    for (var i = 0; i < Math.min(CRACK.length, e.hits * 3); i++) ctx.fillRect(CRACK[i][0] * s, CRACK[i][1] * s, s + 0.5, s + 0.5);
    ctx.restore();
  }
  function stepDuck(d, now) {
    var b, idx;
    if (d.mode === "bubble") {   // floats away; gone for good once it leaves the top of the screen
      d.jy -= 0.7; d.x += Math.sin(now / 600 + d.hue) * 0.0008; b = box(d);
      drawSprite(frameAt("idle", now), b.x, b.y, b.s, d.flip, Math.sin(now / 400) * 0.2, d.hue);
      drawBubble(b.x, b.y, b.r * 1.35, d.bcol || "#8fb8ff");
      if (b.y < -b.r * 2) { ducks.splice(ducks.indexOf(d), 1); bloop(); layout(); if (!ducks.length) setTimeout(function () { var n = newDuck(0.5); n.mode = "falling"; n.jy = -H; ducks.push(n); }, 1200); }
      return;
    }
    if (d.mode === "drag") {
      b = box(d); drawSprite(frameAt("fly", now), b.x, b.y, b.s, d.flip, Math.sin(now / 150) * 0.12, d.hue);
      if (now > (d.flapAt || 0)) { d.flapAt = now + 300; flap(); }
      return;
    }
    d.walking = false;
    if (d.prank && d.mode === "here" && !d.air) stepPrank(d, now);
    else if (!d.air && d.mode !== "bubble") d.x += (d.tx - d.x) * 0.06;
    if (d.mode === "here" && !d.air && now - d.idleAt > 2000 + Math.random() * 1500) { d.idleAt = now; var rr = Math.random(); if (rr < FLY[d.kind]) takeOff(d, now); else if (rr < FLY[d.kind] + 0.25 && moodAct(d, now)) {} else if (rr < FLY[d.kind] + 0.4 && ducks.length + eggs.length < MAX) hide(d, now); }
    if (d.air && d.mode === "here") {
      var A = d.air, landing = now > A.until, gy = landing ? 0 : A.ty + Math.sin(now / 400) * 10;
      if (now > (d.flapAt || 0)) { d.flapAt = now + 380; flap(); }
      d.x += (A.tx - d.x) * 0.02; d.flip = A.tx < d.x; d.jy += (gy - d.jy) * 0.04; d.jv = 0;
      if (!landing && Math.abs(A.tx - d.x) < 0.01 && Math.random() < 0.01) A.tx = 0.12 + Math.random() * 0.76;
      if (landing && d.jy > -3) { d.jy = 0; d.air = null; d.tx = d.x; d.sq = 0.8; thud(); setTag(d, "land", 150, now); d.idleAt = now; }
    }
    if (d.mode === "hiding") { d.jy += 18; if (d.jy > H) { d.mode = "peek"; d.peekAt = now; } }
    if (d.mode === "peek") {
      var p = peekBox(d), up = Math.min(1, (now - d.peekAt) / 400), bob = Math.sin(now / 300) * p.s;
      ctx.save(); ctx.imageSmoothingEnabled = false; ctx.translate(p.x, 0); if (d.flip) ctx.scale(-1, 1);
      if (PEEK.naturalWidth) ctx.drawImage((d.hue && PEEKS[d.hue]) || PEEK, -p.w / 2, H - p.h * up + bob + p.s * 2, p.w, p.h); ctx.restore();
      return;
    }
    if (d.mode === "falling") {
      d.jv += 1.2; d.jy += d.jv;
      if (d.jy >= 0) {
        d.jy = 0; d.jv = 0; d.mode = "here"; d.sq = 0.6; setTag(d, "stunned", 1000, now); b = box(d); burst(b.x, b.y + b.r, 8); thud();
        if (d.egg && ducks.length + eggs.length < MAX) { d.egg = false; eggs.push({ x: d.x, tx: d.x, hits: 0, need: 3 + ((Math.random() * 2) | 0), shake: 1 }); layout(); word(b.x, b.y - b.r * 1.2, "plop!"); }
      }
    } else if (d.mode === "here" && !d.air && (d.jv || d.jy)) { d.jv += 1.1; d.jy += d.jv; if (d.jy >= 0) { d.jy = 0; d.jv = 0; d.sq = 0.8; if (d.tag === "jump") setTag(d, "land", 150, now); } }
    if (d.until && now > d.until) setTag(d, "idle", 0, now);
    d.sq += (1 - d.sq) * 0.2;
    b = box(d);
    idx = d.air ? frameAt("fly", now) : d.walking ? frameAt("walk", now) : d.mode === "falling" ? frameAt("fall", now) : d.tag === "stunned" ? TAGS.stunned.from + (((now - d.tagStart) / 200) | 0) % 5 : frameAt(d.tag, now);
    if (d.mode !== "hiding") { ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(b.x, floorY() + FR * b.s * 0.42, FR * b.s * 0.3, FR * b.s * 0.06, 0, 0, 7); ctx.fill(); }
    ctx.save(); ctx.translate(b.x, b.y + FR * b.s / 2); ctx.scale(2 - d.sq, d.sq); ctx.translate(-b.x, -(b.y + FR * b.s / 2));
    drawSprite(idx, b.x, b.y, b.s, d.flip, d.mode === "falling" ? now / 120 : 0, d.hue);
    ctx.restore();
  }

  /* ---------- bubbles: tap to pop (a little note each); a duck tapped many times floats away in one ---------- */
  var bubbles = [], nextBubble = 0;
  var BCOL = ["#8fb8ff", "#ff8fa3", "#9be37a", "#f6c945", "#56bebc"];
  function stepBubbles(now) {
    if (now > nextBubble && bubbles.length < 3) { nextBubble = now + 3000 + Math.random() * 3000;
      bubbles.push({ x: W * (0.1 + Math.random() * 0.8), y: H + 30, r: 20 + Math.random() * 14, c: BCOL[(Math.random() * BCOL.length) | 0], ph: Math.random() * 6 }); }
    for (var i = bubbles.length - 1; i >= 0; i--) {
      var b = bubbles[i]; b.y -= 0.5; var x = b.x + Math.sin(now / 600 + b.ph) * 20;
      if (b.y < -40) { bubbles.splice(i, 1); continue; }
      b.cx = x; drawBubble(x, b.y, b.r, b.c);
    }
  }
  function drawBubble(x, y, rad, col) {   // pixel circle with a shine
    var s = Math.max(3, Math.round(bigScale())), n = Math.round(rad * 2 / s);
    ctx.globalAlpha = 0.85;
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      var dx = c - n / 2 + 0.5, dy = r - n / 2 + 0.5, dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > n / 2) continue;
      var edge = dist > n / 2 - 1.2, shine = dx < -n / 6 && dy < -n / 6 && dist < n / 3 && dist > n / 5;
      if (!edge && !shine) continue;
      ctx.fillStyle = edge ? col : "#ffffff"; ctx.fillRect(x - rad + c * s, y - rad + r * s, s, s);
    }
    ctx.globalAlpha = 1;
  }
  function popBubble(i, now) {
    var b = bubbles[i]; bubbles.splice(i, 1); burst(b.cx, b.y, 5); blip(1200, 400, 0.15); blip(1400 + Math.random() * 600, 900, 0.12);
  }

  /* ---------- parade (3 taps on empty space) ---------- */
  var parade = [], emptyTaps = [];
  var lastParade = -1e9;
  function startParade(now) {
    if (now - lastParade < 8000 || parade.length) return; lastParade = now;
    var kinds = ["walk", "fly", "drop"], n = 6, dir = Math.random() < 0.5 ? 1 : -1;
    for (var i = 0; i < n; i++) {
      var k = kinds[(Math.random() * 3) | 0], s = Math.max(3, Math.round(bigScale() * (0.3 + Math.random() * 0.25)));
      var p = { k: k, s: s, dir: dir, delay: now + i * 450 + Math.random() * 150, sp: (k === "fly" ? 4 : 2.6) + Math.random() * 1.5, quacked: false };
      p.x = dir > 0 ? -FR * s : W + FR * s;
      p.y = k === "walk" ? H - FR * s * 0.5 - 8 : k === "fly" ? H * (0.1 + Math.random() * 0.35) : -FR * s;
      if (k === "drop") { p.x = W * (0.1 + Math.random() * 0.8); p.vy = 0; p.land = H - FR * s * 0.5 - 8; p.state = "fall"; }
      parade.push(p);
    }
    blip(400, 900, 0.25);
  }
  function stepParade(now) {
    for (var i = parade.length - 1; i >= 0; i--) {
      var p = parade[i]; if (now < p.delay) continue;
      if (!p.quacked && Math.random() < 0.02) { p.quacked = true; quack(1.5 + Math.random() * 0.4, 0.25); }
      var tag;
      if (p.k === "drop") {
        if (p.state === "fall") { p.vy += 0.5; p.y += p.vy; tag = "fall"; if (p.y >= p.land) { p.y = p.land; p.state = "stun"; p.st = now; burst(p.x, p.y + FR * p.s * 0.3, 3); } }
        else if (p.state === "stun") { tag = "stunned"; if (now - p.st > 900) p.state = "walk"; }
        else { p.x += p.sp * p.dir; tag = "walk"; }
      } else { p.x += p.sp * p.dir; tag = p.k; if (p.k === "fly") p.y += Math.sin(now / 200 + i) * 0.6; }
      var idx = p.state === "stun" ? TAGS.stunned.from + (((now - p.st) / 200) | 0) % 5 : frameAt(tag, now + i * 37);
      drawSprite(idx, p.x, p.y, p.s, p.dir < 0, 0);
      if (p.x < -FR * p.s * 2 || p.x > W + FR * p.s * 2) parade.splice(i, 1);
    }
  }

  /* ---------- input ---------- */
  cv.addEventListener("pointerdown", function (e) {
    e.preventDefault(); actx();
    var now = performance.now(), x = e.clientX, y = e.clientY;
    var i, d;
    for (i = ducks.length - 1; i >= 0; i--) { d = ducks[i];
      if (d.mode === "peek") { var p = peekBox(d); if (Math.abs(x - p.x) < p.w && y > H - p.h * 1.6) { emptyTaps = []; tapPeek(d, now); return; } }
      else if (d.mode === "here") { var b = box(d); if (Math.hypot(x - b.x, y - b.y) < b.r) { emptyTaps = []; grab = { d: d, x: x, y: y, id: e.pointerId }; try { cv.setPointerCapture(e.pointerId); } catch (er) {} pokeDuck(d, x, y, now); return; } }
      else if (d.mode === "bubble") { var bb = box(d); if (Math.hypot(x - bb.x, y - bb.y) < bb.r * 1.4) { d.mode = "falling"; d.egg = false; d.jv = 0; burst(bb.x, bb.y, 5); blip(1200, 400, 0.15); emptyTaps = []; return; } } }
    for (i = 0; i < eggs.length; i++) { var eb = eggBox(eggs[i]); if (Math.hypot(x - eb.x, y - eb.y) < eb.ry * 1.6) { emptyTaps = []; tapEgg(eggs[i], now); return; } }
    for (i = 0; i < bubbles.length; i++) { var bu = bubbles[i]; if (Math.hypot(x - (bu.cx || bu.x), y - bu.y) < bu.r + 18) { popBubble(i, now); emptyTaps = []; return; } }
    var sr = songRect(); if (x >= sr.x && x <= sr.x + sr.w && y >= sr.y && y <= sr.y + sr.h) { emptyTaps = []; toggleSong(); return; }
    for (i = 0; i < NK; i++) { var kr = keyRect(i); if (x >= kr.x - 3 && x <= kr.x + kr.w + 3 && y >= kr.y - 6 && y <= kr.y + kr.h + 6) { emptyTaps = []; playKey(i, now); return; } }
    burst(x, y, 3); blip(500 + Math.random() * 400, 300, 0.12);
    emptyTaps = emptyTaps.filter(function (t) { return now - t < 900; }); emptyTaps.push(now);
    if (emptyTaps.length >= 3) { emptyTaps = []; startParade(now); }
  });
  /* drag a duck: hold and move it; let go over a bubble and it rides that bubble away */
  var grab = null;
  cv.addEventListener("pointermove", function (e) {
    if (!grab || e.pointerId !== grab.id) return;
    var d = grab.d;
    if (d.mode !== "drag") { if (Math.hypot(e.clientX - grab.x, e.clientY - grab.y) < 14 || d.mode !== "here") return; d.mode = "drag"; d.air = null; d.jv = 0; whoosh(); }
    d.flip = e.clientX < d.x * W; d.x = e.clientX / W; d.jy = e.clientY - floorY();
  });
  function release(e) {
    if (!grab || e.pointerId !== grab.id) return;
    var d = grab.d; grab = null; if (d.mode !== "drag") return;
    var b = box(d);
    for (var i = 0; i < bubbles.length; i++) { var bu = bubbles[i];
      if (Math.hypot(b.x - bu.cx, b.y - bu.y) < bu.r + b.r) { bubbles.splice(i, 1); d.mode = "bubble"; d.bcol = bu.c; d.x = bu.cx / W; d.jy = bu.y - floorY(); quack(1.8, 0.35); bloop(); word(bu.cx, bu.y - b.r * 1.6, "bye!"); return; } }
    d.mode = "falling"; d.egg = false; d.jv = 0; d.tx = d.x;   // dropped somewhere else: just tumbles down
  }
  cv.addEventListener("pointerup", release); cv.addEventListener("pointercancel", release);
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

  /* ---------- full screen button (hidden where the browser can't do it, e.g. iPhone Safari) ---------- */
  var fsBtn = document.getElementById("fs"), root = document.documentElement;
  var reqFS = root.requestFullscreen || root.webkitRequestFullscreen;
  if (reqFS) {
    fsBtn.hidden = false;
    fsBtn.addEventListener("click", function () {
      actx();
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { var r = reqFS.call(root); if (r && r.catch) r.catch(function () {}); }
    });
  }

  /* ---------- loop ---------- */
  function frame(now) {
    buildTints();
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#101010"; ctx.fillRect(0, 0, W, H);
    bg.forEach(function (p) {
      p.y -= p.v / 60; if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
      ctx.globalAlpha = p.a * (0.6 + 0.4 * Math.sin(now / 700 + p.ph)); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x * W + Math.sin(now / 1500 + p.ph) * 12, p.y * H, p.r, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;

    drawKeys(); drawSongButton(now);
    eggs.forEach(function (e) { e.x += (e.tx - e.x) * 0.06; drawEgg(e, now); });
    ducks.forEach(function (d) { stepDuck(d, now); });
    stepBubbles(now);
    stepParade(now);

    for (var i = fx.length - 1; i >= 0; i--) {
      var f = fx[i]; f.x += f.vx; f.y += f.vy; f.life -= f.k === "t" ? 0.012 : 0.02;
      if (f.k === "p") { f.vy += 0.25; f.rot += 0.2; }
      if (f.life <= 0) { fx.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, f.life * 1.5); ctx.fillStyle = f.c;
      if (f.k === "p") { ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); ctx.fillRect(-f.s / 2, -f.s / 2, f.s, f.s); ctx.restore(); }
      else { ctx.font = "bold " + Math.round(Math.max(18, bigScale() * 6)) + "px system-ui, -apple-system, sans-serif"; ctx.textAlign = "center"; ctx.lineWidth = 6; ctx.strokeStyle = "#101010"; ctx.strokeText(f.t, f.x, f.y); ctx.fillText(f.t, f.x, f.y); }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
